<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .main {
            height: 100vh;
            background-color: #FF5200;
            display: flex;
            flex-direction: column;

        }

        header {
            height: 100px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        header>.header-logo>img {
            height: 51px;
            width: 174px;
        }

        header>.nav>a {
            text-decoration: none;
            margin: 0px 20px;
            color: white;
        }

        header>.nav>#getapp {
            height: 54px;
            width: 150px;
            border: 1px solid white;
            padding: 20PX;
            border-radius: 20PX;

        }

        header>.nav>#signin {
            height: 54px;
            width: 150px;
            border: 1px solid white;
            padding: 20PX;
            border-radius: 20PX;
            background-color: black;
            color: white;

        }

        .main>.hero {
            height: 350px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main>.hero>img {
            height: 500px;
            margin-top: 170px;

        }

        .main>.hero>.data>.abt>h4 {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 48px;
            font-weight: 600;
            color: white;
        }

        .main>.hero>.data {
            margin-top: -20px;

        }

        .main>.hero>.data>.input {
            display: flex;
            gap: 20px;
            justify-content: space-evenly;
            margin-top: 10px;
        }


        .main>.hero>.data>.input>.location {
            height: 61px;
            width: 310px;
            background-color: white;
            text-align: center;
            border-radius: 20px;

        }

        .main>.hero>.data>.input>.location>select {
            height: 100%;
            border: none;
        }

        .main>.hero>.data>.input>.item {
            height: 61px;
            width: 481px;
            text-align: center;

        }

        .main>.hero>.data>.input>.item>input {
            padding: 0px 50px;
            width: 100%;
            height: 100%;
            border: 0px;
            border-radius: 20px;

        }

        span {
            display: block;
        }

        .main>.foodcard {
            height: 324px;
            width: 80%;
            margin-left: 210px;
            display: flex;
            align-items: center;
            margin-top: -60px;
        
        }
         .main>.foodcard>img{
            height: 100%;
         }
         .main>.sep{
            margin-left:190px ;
            height: 10px;
            background-color: white;
            width: 75%;

         }
    </style>
</head>

<body>
    <div class="main">
        <header>
            <div class="header-logo">
                <img src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/static-assets/images/swiggy_logo_white.png"
                    alt="">
            </div>
            <div class="nav">
                <a href="">Swiggy cor</a>
                <a href="">Partner</a>
                <a href="" id="getapp">get the app</a>
                <a href="" id="signin">sign in</a>
            </div>
        </header>
        <div class="hero">
            <img src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/testing/seo-home/Veggies_new.png"
                alt="">
            <div class="data">
                <div class="abt">
                    <h4><span>Order food & groceries. Discover</span>
                        <span>best restaurants. Swiggy it!</span>

                    </h4>
                </div>
                <div class="input">
                    <div class="location">
                        <select name="place" id="place">
                            <option value="">use my current </option>
                        </select>

                    </div>
                    <div class="item">
                        <input type="text" id="ip" placeholder="search for reasturant,itm or more">
                    </div>
                </div>
            </div>
            <img src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/testing/seo-home/Sushi_replace.png"
                alt="">
        </div>
        <div class="foodcard">
            <img src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/MERCHANDISING_BANNERS/IMAGES/MERCH/2024/7/23/ec86a309-9b06-48e2-9adc-35753f06bc0a_Food3BU.png"
                alt="">
            <img src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/MERCHANDISING_BANNERS/IMAGES/MERCH/2024/7/23/b5c57bbf-df54-4dad-95d1-62e3a7a8424d_IM3BU.png"
                alt="">
            <img src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/MERCHANDISING_BANNERS/IMAGES/MERCH/2024/7/23/b6d9b7ab-91c7-4f72-9bf2-fcd4ceec3537_DO3BU.png"
                alt="">
        </div>
        <div class="sep"></div>
    </div>
</body>

</html>
